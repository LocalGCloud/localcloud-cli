# LocalCloud unified configuration defaults
# Canonical server, service-catalog, and infrastructure settings packaged with
# the JAR and Docker image. localcloud.yaml is a recursive overlay; mapping
# members set to null are deleted before the effective document is validated.
# Read by: Java (Jackson/SnakeYAML), Python (PyYAML), and repository tooling.

version: 1

context:
  project: local-gcp-project

host:
  docker_socket: auto
  transparent_network: false

tls:
  enabled: false
  port: 24443
  certificate: ""
  private_key: ""

server:
  data_dir: /var/lib/localcloud
  gateway:
    port: 24080
  iam:
    mode: permissive
    policy_file: ""
    log_warnings: true
  logging:
    verbosity: info
  persistence: true
  auto_seed: true
  gcp_credentials:
    source: none
    adc_path: /credentials/adc/application_default_credentials.json
    sa_key_path: /credentials/sa-key.json
  postgres:
    host: localhost
    port: 24090
    database: localcloud
    user: localcloud
    password: localcloud
  api_key: ""
  license_server_url: none
  dataproc_registry: jaysen2apache/dataproc

services:
  enabled: default
  catalog:
    gcs:
      displayName: "Cloud Storage"
      availability: available
      port: 24081
      protocol: rest
      envVar: STORAGE_EMULATOR_HOST
      envValuePrefix: "http://"
      type: external
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: storage
      terraformEnvVar: GOOGLE_STORAGE_CUSTOM_ENDPOINT
      healthCheck:
        type: tcp

    pubsub:
      displayName: "Pub/Sub"
      availability: available
      port: 24082
      protocol: grpc
      envVar: PUBSUB_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: pubsub
      terraformEnvVar: GOOGLE_PUBSUB_CUSTOM_ENDPOINT

    firestore:
      displayName: "Firestore"
      availability: available
      port: 24083
      protocol: grpc
      envVar: FIRESTORE_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: false
      # Firestore emulator seeding is not implemented yet (SeedService skips it) —
      # keep disabled by default until seeding support lands.
      defaultEnabled: false
      minTier: community
      gcloudApiName: firestore
      terraformEnvVar: GOOGLE_FIRESTORE_CUSTOM_ENDPOINT
      healthCheck:
        type: http

    bigtable:
      displayName: "Bigtable"
      availability: available
      port: 24084
      protocol: grpc
      envVar: BIGTABLE_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: true
      defaultEnabled: true
      minTier: pro
      # No gcloudApiName: Bigtable emulator is gRPC data-plane only; gcloud bigtable
      # commands use the bigtableadmin REST API which the emulator does not serve.
      terraformEnvVar: GOOGLE_BIGTABLE_CUSTOM_ENDPOINT
      healthCheck:
        type: tcp

    spanner:
      displayName: "Spanner"
      availability: available
      port: 24085
      protocol: grpc
      envVar: SPANNER_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: pro
      gcloudApiName: spanner
      gcloudPort: 24086
      terraformEnvVar: GOOGLE_SPANNER_CUSTOM_ENDPOINT
      additionalPorts:
        rest: 24086
      healthCheck:
        type: http
        port: 24086
        path: "/v1/projects/{projectId}/instances"

    bigquery:
      displayName: "BigQuery"
      availability: available
      port: 24087
      protocol: rest
      envVar: BIGQUERY_EMULATOR_HOST
      envValuePrefix: "http://"
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: community
      gcloudApiName: bigquery
      terraformEnvVar: GOOGLE_BIGQUERY_CUSTOM_ENDPOINT
      additionalPorts:
        grpc: 24088
      healthCheck:
        type: http
        path: "/bigquery/v2/projects/{projectId}/datasets"


    sheets:
      displayName: "Google Sheets"
      availability: available
      port: gateway
      protocol: rest
      envVar: SHEETS_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community

    secretmanager:
      displayName: "Secret Manager"
      availability: available
      port: gateway
      protocol: grpc
      envVar: SECRET_MANAGER_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: secretmanager
      terraformEnvVar: GOOGLE_SECRET_MANAGER_CUSTOM_ENDPOINT

    cloudtasks:
      displayName: "Cloud Tasks"
      availability: available
      port: gateway
      protocol: grpc
      envVar: CLOUD_TASKS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudtasks
      terraformEnvVar: GOOGLE_CLOUD_TASKS_CUSTOM_ENDPOINT

    cloudscheduler:
      displayName: "Cloud Scheduler"
      availability: available
      port: gateway
      protocol: grpc
      envVar: CLOUD_SCHEDULER_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudscheduler
      terraformEnvVar: GOOGLE_CLOUD_SCHEDULER_CUSTOM_ENDPOINT

    cloudfunctions:
      displayName: "Cloud Functions (2nd Gen)"
      availability: available
      port: gateway
      protocol: grpc
      envVar: CLOUD_FUNCTIONS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudfunctions
      terraformEnvVar: GOOGLE_CLOUD_FUNCTIONS_CUSTOM_ENDPOINT

    alloydb:
      displayName: "AlloyDB"
      availability: available
      port: gateway
      protocol: grpc
      envVar: ALLOYDB_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: alloydb
      terraformEnvVar: GOOGLE_ALLOYDB_CUSTOM_ENDPOINT

    dataproc:
      displayName: "Dataproc"
      availability: available
      port: gateway
      protocol: grpc
      envVar: DATAPROC_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: dataproc
      terraformEnvVar: GOOGLE_DATAPROC_CUSTOM_ENDPOINT
      runtimeDependencies: [docker]

    cloudiam:
      displayName: "Cloud IAM"
      availability: available
      port: gateway
      protocol: grpc
      envVar: IAM_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: iam
      terraformEnvVar: GOOGLE_IAM_CUSTOM_ENDPOINT

    cloudresourcemanager:
      displayName: "Cloud Resource Manager"
      availability: available
      port: gateway
      protocol: rest
      envVar: CLOUD_RESOURCE_MANAGER_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudresourcemanager
      terraformEnvVar: GOOGLE_RESOURCE_MANAGER_CUSTOM_ENDPOINT

    serviceusage:
      displayName: "Service Usage"
      availability: available
      port: gateway
      protocol: rest
      envVar: SERVICE_USAGE_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      terraformEnvVar: GOOGLE_SERVICE_USAGE_CUSTOM_ENDPOINT

    cloudbilling:
      displayName: "Cloud Billing"
      availability: available
      port: gateway
      protocol: rest
      envVar: CLOUD_BILLING_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      terraformEnvVar: GOOGLE_CLOUD_BILLING_CUSTOM_ENDPOINT

    logging:
      displayName: "Cloud Logging"
      availability: available
      port: gateway
      protocol: grpc
      envVar: CLOUD_LOGGING_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: logging
      terraformEnvVar: GOOGLE_LOGGING_CUSTOM_ENDPOINT

    monitoring:
      displayName: "Cloud Monitoring"
      availability: available
      port: gateway
      protocol: grpc
      envVar: CLOUD_MONITORING_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: monitoring
      terraformEnvVar: GOOGLE_MONITORING_CUSTOM_ENDPOINT

    gke:
      displayName: "GKE"
      availability: available
      port: gateway
      protocol: grpc
      envVar: GKE_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: false
      minTier: pro
      gcloudApiName: container
      terraformEnvVar: GOOGLE_CONTAINER_CUSTOM_ENDPOINT
      runtimeDependencies: [docker]
      additionalPorts:
        k3d: 24092

    compute:
      displayName: "Compute Engine"
      availability: available
      port: gateway
      protocol: rest
      envVar: COMPUTE_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: false
      minTier: pro
      gcloudApiName: compute
      terraformEnvVar: GOOGLE_COMPUTE_CUSTOM_ENDPOINT
      runtimeDependencies: [docker]

    cloudrun:
      displayName: "Cloud Run"
      availability: available
      port: gateway
      protocol: grpc
      envVar: CLOUD_RUN_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: false
      minTier: pro
      gcloudApiName: run
      terraformEnvVar: GOOGLE_CLOUD_RUN_CUSTOM_ENDPOINT
      runtimeDependencies: [docker]

    memorystore:
      displayName: "Memorystore (Redis/Valkey)"
      availability: available
      port: 24089
      protocol: redis
      envVar: REDIS_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: community
      terraformEnvVar: GOOGLE_REDIS_CUSTOM_ENDPOINT

    workflows:
      displayName: "Cloud Workflows"
      availability: available
      port: gateway
      protocol: grpc
      envVar: WORKFLOWS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: workflows
      terraformEnvVar: GOOGLE_WORKFLOWS_CUSTOM_ENDPOINT

    vertexai:
      displayName: "Vertex AI"
      availability: available
      port: gateway
      protocol: rest
      envVar: AIPLATFORM_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: false
      minTier: pro
      gcloudApiName: aiplatform
      terraformEnvVar: GOOGLE_VERTEX_AI_CUSTOM_ENDPOINT

    kms:
      displayName: "Cloud KMS"
      availability: available
      port: gateway
      protocol: rest
      envVar: CLOUD_KMS_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: false
      minTier: pro
      gcloudApiName: cloudkms
      terraformEnvVar: GOOGLE_KMS_CUSTOM_ENDPOINT

    cloudsql:
      displayName: "Cloud SQL"
      availability: available
      port: gateway
      protocol: rest
      envVar: CLOUD_SQL_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: sqladmin
      terraformEnvVar: GOOGLE_SQL_CUSTOM_ENDPOINT
      additionalPorts:
        postgres: 24090
        mysql: 24091 # MySQL 8.4.11 LTS, shared server started on demand

infrastructure:
  dns:
    displayName: "LocalCloud DNS"
    port: 24093
    protocol: udp
