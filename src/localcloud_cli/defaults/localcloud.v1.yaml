# LocalCloud configuration defaults (version 1)
# Generated by scripts/sync-gateway-defaults.py from the LocalCloud image's
# /opt/localcloud/localcloud.defaults.yaml. Do not edit by hand: re-run the script.
# Source: agentcloud/localcloud:0.1.17
# Source sha256: ea4b8f04d46492dc314ecda37c5e4e20bc92f4189adfccb0520f050c7140d9a3
#
# localcloud.yaml is a recursive overlay on this document: omitted values inherit,
# and a mapping member set to null is deleted.

version: 1

context:
  project: local-gcp-project

host:
  transparent_network: false
  data_volume: localcloud-data
  backup_dir: ~/.localcloud/backups
  data: persistent
  docker_socket: auto
  network_name: localcloud

tls:
  enabled: false
  port: 5381
  certificate: ""
  private_key: ""

mcp:
  write: false
  destructive: false
  # Admit MCP clients from any Origin (LOCALCLOUD_MCP_ALLOW_REMOTE=true does the same). The Host
  # and cross-site rules still apply, so a rebinding page or a cross-site form is refused. MCP
  # POSTs must be application/json whatever this is set to.
  allow_remote: false

updater:
  enabled: true
  auto_update: false
  auto_restart_container: false
  check_interval_hours: 24
  # Empty follows the running image's channel: agentcloud/localcloud:lite on lite, :latest otherwise.
  image: ""

server:
  # Saved sync credentials are encrypted with a key kept in sync/encryption.key under this directory,
  # unless LOCALCLOUD_ENCRYPTION_KEY is set. Keep the directory and that key file together. If the key
  # cannot be created or read, the gateway still starts, and sync answers 503 until it can be.
  data_dir: /var/lib/localcloud
  gateway:
    port: 5380
  # The control token protects the control plane (admin REST, MCP, admin SQL, KMS administration, identity
  # minting). It is off by default on a local gateway: every control-plane route answers without it. The
  # gateway still keeps a per-install token in control-token under data_dir, created on first start.
  # enabled: true (or LOCALCLOUD_CONTROL_TOKEN_ENABLED=true) turns it on with that file's token. A value (at
  # least 32 printable characters, or LOCALCLOUD_CONTROL_TOKEN) turns it on with your own token. Remote
  # access (mcp.allow_remote or a non-empty allowed_hosts) turns it on too, unless enabled is false: an
  # explicit false keeps it off even then, which is unsafe and logged as a warning. Leave enabled unset
  # for the default; false with a value is refused.
  control_token:
    value: ""
  # Serve the Console UI from the gateway. false (or LOCALCLOUD_CONSOLE=false) runs headless:
  # service and admin APIs are unchanged, Console pages and assets return 404 CONSOLE_DISABLED.
  console:
    enabled: true
  # true keeps state in server.postgres and under server.data_dir. A configured PostgreSQL that does
  # not answer within 30 seconds does not stop the gateway: it serves without durable state, and
  # /readiness reports it not ready (database not_connected) until a restart connects the database.
  # false runs memory-only on purpose: PostgreSQL is never contacted, and the state is lost when the
  # gateway stops. A local run with no PostgreSQL (a test or scratch run outside the image) sets
  # persistence: false. A permanent startup refusal (a changed migration, or Cloud KMS key state in a
  # format this version no longer reads) exits non-zero, and the image restarts the gateway, so the
  # same refusal repeats in the log until the database is repaired.
  persistence: true
  auto_seed: true
  # What a request that names a project with no record gets. provision (the default) records the project
  # the first time an authorized request names it. allow serves the request without recording the project.
  # reject answers as Google answers a project that does not exist or that the caller cannot see: 403
  # PERMISSION_DENIED, "Permission denied on resource project <id>.", with ErrorInfo reason CONSUMER_INVALID.
  # In every mode a known project number in a resource name (projects/123456789012/...) is read as that
  # project's ID, and an all-digit project ID is never recorded, since Google refuses one. Projects created
  # through Resource Manager, the Console, the admin API or MCP are recorded in every mode, and in reject mode
  # a seed records the projects it writes to, so they all work in reject mode. Resource Manager's own routes
  # and calls the gateway makes itself are never refused. auto_provision_projects: false is the older
  # spelling of allow and still means it.
  unknown_project: provision
  auto_provision_projects: true
  # Browser requests are those that carry an Origin or Fetch Metadata header. Such a request is served
  # only when its Host is loopback, an IP literal, a gateway name, *.googleapis.com or listed in
  # allowed_hosts, and when its Origin, if it has one, is loopback, the request's own origin (unless
  # that host is a googleapis name) or listed in allowed_origins. Anything else gets 403 with a
  # reason that names the setting. Requests without browser headers (SDKs, gcloud, Terraform, the
  # CLI) are never refused by these checks. A state-changing browser request to the control plane
  # (the admin REST and GraphQL, KMS, reset and seed, migrations, identity minting, the Data Mirror and
  # workflow environments; MCP keeps its own rules) is stricter: it is served only from the gateway's own
  # origin or an origin listed here, so a loopback page another local app serves is refused too.
  # That holds with or without the control token. Entries are scheme://host[:port] origins and host names
  # (or IP literals, or *.suffix). Environment: LOCALCLOUD_ALLOWED_ORIGINS and LOCALCLOUD_ALLOWED_HOSTS,
  # comma-separated. Validated at load; applied on restart. A LAN device's dev app (for example
  # http://192.168.1.20:3000) needs its origin listed here.
  # Exposure: the gateway and its published ports listen on every interface inside the container. The CLI
  # publishes them on every host interface by default, so a LAN host can reach them; starting the CLI with
  # --local-only restricts the publish to loopback. The browser policy does not authenticate a LAN client
  # that sends no browser headers.
  allowed_origins: []
  allowed_hosts: []
  # Largest result an admin SQL query returns. A result stops at the first limit it reaches and is
  # marked truncated, so one SELECT cannot exhaust the gateway's memory.
  query_max_rows: 10000
  query_max_bytes: 8388608
  # Admin query history rows kept in the metadata database. 0 keeps every statement; a positive number
  # keeps that many of the newest and prunes the rest. Set it to bound the history on a long-lived instance.
  query_history_keep_rows: 0
  # Migration runs kept in the metadata database. 0 keeps every run; a positive number keeps that many of the
  # newest finished runs and prunes the rest. The gateway holds only the newest 100 in memory either way.
  migration_run_keep_rows: 0
  # Hours a finished long-running operation (KMS, Workflows, Cloud Run, Dataproc) stays answerable after its
  # last update. 0 keeps every operation; a positive number deletes older finished operations from memory and
  # from the metadata database. Running operations are never removed.
  operation_retention_hours: 0
  # Local workload identity: signed ID/access tokens for ADC, OAuth, IAM Credentials and
  # authenticated delivery. Tokens are signed by this runtime's own keys, never Google's.
  identity:
    enabled: true
    # auto = https://identity.localcloud.internal/<runtime-id>; or an explicit http(s) URL.
    issuer_url: auto
    id_token_lifetime_seconds: 3600
    access_token_lifetime_seconds: 3600
    clock_skew_seconds: 60
    # auto serves gateway metadata in open/permissive IAM modes only; auto | disabled.
    gateway_metadata: auto
    # Image Compute instances and Cloud Run services start their metadata relay from (the
    # LocalCloud image, which contains /opt/localcloud/bin/localcloud-relay). Empty selects
    # LOCALCLOUD_IMAGE, then the running LocalCloud container's own image.
    relay_image: ""
  gcp_credentials:
    source: none
  postgres:
    host: localhost
    port: 5391
    database: localcloud
    user: localcloud
    password: localcloud

services:
  enabled: default
  catalog:
    gcs:
      displayName: "Cloud Storage"
      availability: available
      resettableData: true
      plaintextPort: 5382
      tlsPort: 5392
      protocol: rest
      envVar: STORAGE_EMULATOR_HOST
      envValuePrefix: "http://"
      type: external
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: storage
      terraformEnvVar: GOOGLE_STORAGE_CUSTOM_ENDPOINT
      config:
        lifecycle_interval_seconds: 0
      config_descriptions:
        lifecycle_interval_seconds: Seconds between runs of the buckets' lifecycle rules (Delete, SetStorageClass, AbortIncompleteMultipartUpload). Cloud Storage applies them asynchronously, about once a day. 0 (the default) never runs them on a timer; POST /mutate/gcs/lifecycle/run runs them once.
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: fake-gcs-server
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: fake-gcs-server
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/fake-gcs-server-stdout.log
                stderr: /var/log/localcloud/fake-gcs-server-stderr.log
              format: text
              retentionProfile: external-process

    pubsub:
      displayName: "Pub/Sub"
      availability: available
      resettableData: true
      plaintextPort: 5383
      tlsPort: 5393
      protocol: grpc
      envVar: PUBSUB_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: pubsub
      terraformEnvVar: GOOGLE_PUBSUB_CUSTOM_ENDPOINT
      config:
        enforce_subscription_retention: false
        subscription_retention_days: 7
      config_descriptions:
        enforce_subscription_retention: "Expire subscription messages by age, as Pub/Sub does. Off (the default), no message expires: unacknowledged messages, and the acknowledged ones a subscription retains, stay until they are acknowledged, purged or their subscription is deleted, whatever message_retention_duration the subscription names, and the resource still reports the retention it was given. Retained messages are held in memory and loaded at startup, so a backlog that is never consumed grows both: purge it, or turn this on. Set true to test retention: a message then expires past its subscription's message_retention_duration, or past subscription_retention_days when it names none. Applies from the next start."
        subscription_retention_days: "Days a subscription keeps its messages when it sets no message_retention_duration, while enforce_subscription_retention is on. The default is Google's 7 days; 0 keeps them until they are acknowledged or purged. A subscription's message_retention_duration, when set, always wins. Applies to every subscription that sets none, from the next start."
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: java-runtime
              component: pubsub
              strategy: direct
              fallback: raw-only
              kind: internal
              paths:
                raw: /var/log/localcloud/localcloud-server.log
              format: json
              retentionProfile: java-facade

    firestore:
      displayName: "Firestore"
      availability: available
      resettableData: true
      plaintextPort: 5384
      protocol: grpc+rest
      envVar: FIRESTORE_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: false
      config:
        compatibilityProfile: java
        rulesFile: ""
      minTier: community
      gcloudApiName: firestore
      terraformEnvVar: GOOGLE_FIRESTORE_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: facade-runtime
              component: firestore
              strategy: direct
              fallback: raw-only
              kind: internal
              paths:
                raw: /var/log/localcloud/localcloud-server.log
              format: json

    bigtable:
      displayName: "Bigtable"
      availability: available
      resettableData: true
      plaintextPort: 5385
      protocol: grpc
      envVar: BIGTABLE_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: true
      defaultEnabled: true
      minTier: pro
      gcloudApiName: bigtableadmin
      terraformEnvVar: GOOGLE_BIGTABLE_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: bigtable-emulator
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: bigtable-emulator
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/bigtable-emulator-stdout.log
                stderr: /var/log/localcloud/bigtable-emulator-stderr.log
              format: text
              retentionProfile: external-process

    spanner:
      displayName: "Spanner"
      availability: available
      resettableData: true
      plaintextPort: 5386
      protocol: grpc
      envVar: SPANNER_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: pro
      gcloudApiName: spanner
      terraformEnvVar: GOOGLE_SPANNER_CUSTOM_ENDPOINT
      # The gateway publishes 5386 (gRPC) and 5387 (REST) behind the browser policy and IAM. The Spanner
      # engine itself listens only on loopback inside the container.
      additionalPorts:
        rest: 5387
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: spanner-emulator
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: spanner-emulator
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/spanner-emulator-stdout.log
                stderr: /var/log/localcloud/spanner-emulator-stderr.log
              format: text
              retentionProfile: external-process
      # Service-owned runtime settings — user-editable in localcloud.yaml and
      # applied by restarting this service.
      config:
        backup_enabled: false
        backup_interval_seconds: 60
        remote_functions_host_port: ""
      config_descriptions:
        backup_enabled: Retired compatibility setting. Periodic live LevelDB backup is not started; use the explicit host whole-volume snapshot command.
        backup_interval_seconds: Retired compatibility setting retained for older overlays (positive integer, >= 10; no scheduler is started).
        remote_functions_host_port: Localhost port of an in-container Remote UDF/model adapter; empty uses deterministic test responses. Set as localhost:PORT.

    bigquery:
      displayName: "BigQuery"
      availability: available
      resettableData: true
      # BigQuery runs natively inside the LocalCloud container under Supervisor; it needs no Docker access.
      plaintextPort: 5388
      tlsPort: tls
      protocol: rest
      envVar: BIGQUERY_EMULATOR_HOST
      envValuePrefix: "http://"
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: community
      gcloudApiName: bigquery
      terraformEnvVar: GOOGLE_BIGQUERY_CUSTOM_ENDPOINT
      grpcPort: 5389
      # Service-owned runtime settings — user-editable in localcloud.yaml and
      # applied by restarting this service.
      # The BigQuery engine version is fixed by the image.
      config:
        memory_limit: 512MB
        threads: 2
        log_level: info
        streaming_buffer_flush_seconds: 0
      config_descriptions:
        memory_limit: Maximum DuckDB memory available to BigQuery queries (positive size with unit, e.g. 512MB, 2GB).
        threads: Maximum worker threads used to execute BigQuery queries (positive integer).
        log_level: BigQuery emulator log verbosity (debug, info, warn, error).
        streaming_buffer_flush_seconds: Seconds that rows streamed with tabledata.insertAll stay in the streaming buffer. While they do, UPDATE, DELETE and MERGE over them are refused, as in BigQuery (1800 matches Google). 0 (the default) reports the buffer but lets DML change buffered rows.
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: bigquery-emulator
              strategy: collector
              fallback: raw-only
              kind: file
              paths:
                stdout: /var/log/localcloud/bigquery-emulator-stdout.log
                stderr: /var/log/localcloud/bigquery-emulator-stderr.log
              format: json
              retentionProfile: external-process



    sheets:
      displayName: "Google Sheets"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: rest
      envVar: SHEETS_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: sheets
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: sheets, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    secretmanager:
      displayName: "Secret Manager"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: SECRET_MANAGER_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: secretmanager
      terraformEnvVar: GOOGLE_SECRET_MANAGER_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: secretmanager, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    cloudtasks:
      displayName: "Cloud Tasks"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: CLOUD_TASKS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudtasks
      terraformEnvVar: GOOGLE_CLOUD_TASKS_CUSTOM_ENDPOINT
      config:
        task_name_reuse_window_seconds: 0
        queue_name_reuse_window_seconds: 0
        activity_retention_days: 0
      config_descriptions:
        activity_retention_days: Days of completed task attempts the Local activity view keeps; 0 keeps them until cleared. Set 7 to test the window the activity view once showed.
        queue_name_reuse_window_seconds: Seconds a queue name stays unavailable after its queue is deleted; creating it again answers FAILED_PRECONDITION. 0 turns the window off, so a name is reusable at once. Google documents a window of up to 3 days (259200). Valid range is 0 to 777600 (9 days).
        task_name_reuse_window_seconds: Seconds a task ID stays unavailable after its task is deleted, completes, exhausts its retries or is purged; creating that ID again answers ALREADY_EXISTS. 0 turns the window off, so an ID is reusable at once. Google releases an ID after up to 24 hours (86400). Valid range is 0 to 777600 (9 days).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: cloudtasks, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    cloudscheduler:
      displayName: "Cloud Scheduler"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc+rest
      envVar: CLOUD_SCHEDULER_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudscheduler
      terraformEnvVar: GOOGLE_CLOUD_SCHEDULER_CUSTOM_ENDPOINT
      config:
        executions_keep_per_job: 0
      config_descriptions:
        executions_keep_per_job: "Executions each job keeps in its history; 0 keeps every execution. A positive number keeps that many of the newest and deletes the older ones, with the runs they name, when a run completes. The history view shows at most the newest 100 either way."
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: cloudscheduler, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    cloudfunctions:
      displayName: "Cloud Functions (2nd Gen)"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: CLOUD_FUNCTIONS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudfunctions
      terraformEnvVar: GOOGLE_CLOUD_FUNCTIONS_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: cloudfunctions, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    alloydb:
      displayName: "AlloyDB"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: ALLOYDB_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: alloydb
      terraformEnvVar: GOOGLE_ALLOYDB_CUSTOM_ENDPOINT
      config:
        operation_retention_hours: 0
      config_descriptions:
        operation_retention_hours: "Hours an AlloyDB operation stays answerable; 0 keeps it until the count bound of 1000 operations removes it. Set 24 to test the window the operations once had."
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: alloydb, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    dataproc:
      displayName: "Dataproc"
      availability: available
      resettableData: true
      runtimeDependencies: [docker]
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: DATAPROC_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: dataproc
      terraformEnvVar: GOOGLE_DATAPROC_CUSTOM_ENDPOINT
      # Service-owned runtime settings (moved from server.dataproc_registry).
      # User-editable in localcloud.yaml and applied by restarting Dataproc.
      config:
        registry: agentcloud/dataproc
        prefer_native: true
      config_descriptions:
        registry: Container registry / repository prefix for Dataproc cluster images (non-blank).
        prefer_native: Prefer platform-native Dataproc images over QEMU-emulated generic images when available (boolean).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: dataproc, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    cloudiam:
      displayName: "Cloud IAM"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: IAM_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: iam
      terraformEnvVar: GOOGLE_IAM_CUSTOM_ENDPOINT
      # Service-owned runtime settings (moved from server.iam). User-editable in
      # localcloud.yaml and applied by restarting Cloud IAM.
      config:
        mode: open
        policy_file: ""
        log_warnings: true
      config_descriptions:
        mode: IAM mode — 'open' silently allows requests, 'permissive' allows requests with decision logging, 'strict' enforces local policy and needs an identity (X-LocalCloud-User or a LocalCloud token) on every route except the admin plane and the Cloud Storage, Firestore and Cloud Functions trigger routes, which enforce their own access; Cloud KMS and Cloud Tasks check each call against their own IAM policies, so the policy file does not bind them. 'gcp-live' is meant to delegate authorization to real GCP IAM, but this build does not call Google, so gcp-live refuses every bearer token it cannot verify and fails closed. In 'strict', a LocalCloud-signed token decides the caller alone; without one, the X-LocalCloud-User header (when the request carries no credential) or the developer token names the caller, and that identity is self-asserted, since any client can write it, until a signed developer credential exists. In 'gcp-live', LocalCloud credentials are refused and the IAM policy, token minting and session routes fail closed.
        policy_file: Optional IAM policy JSON file. In strict mode with no file, or a file with no bindings, every identified caller is admitted and anonymous requests are refused; a file with bindings admits only the identities and paths it lists; a file that cannot be read or parsed refuses every identified caller until it loads.
        log_warnings: Log Cloud IAM operation warnings when enabled, each kind once per IAM settings change and later calls at DEBUG; suppressed in open mode (boolean).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: cloudiam, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    cloudresourcemanager:
      displayName: "Cloud Resource Manager"
      availability: available
      resettableData: false
      plaintextPort: gateway
      tlsPort: tls
      protocol: rest
      envVar: CLOUD_RESOURCE_MANAGER_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: cloudresourcemanager
      terraformEnvVar: GOOGLE_RESOURCE_MANAGER_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: cloudresourcemanager, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    serviceusage:
      displayName: "Service Usage"
      availability: available
      resettableData: false
      plaintextPort: gateway
      tlsPort: tls
      protocol: rest
      envVar: SERVICE_USAGE_EMULATOR_HOST
      gcloudApiName: serviceusage
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      terraformEnvVar: GOOGLE_SERVICE_USAGE_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: serviceusage, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    cloudbilling:
      displayName: "Cloud Billing"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: rest
      envVar: CLOUD_BILLING_EMULATOR_HOST
      gcloudApiName: cloudbilling
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      terraformEnvVar: GOOGLE_CLOUD_BILLING_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: cloudbilling, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    logging:
      displayName: "Cloud Logging"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: CLOUD_LOGGING_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: logging
      terraformEnvVar: GOOGLE_LOGGING_CUSTOM_ENDPOINT
      config:
        application_retention_days: 0
        application_max_size_mb: 512
        runtime_retention_days: 0
        runtime_max_size_mb: 128
        raw_retention_hours: 0
        raw_max_size_mb: 128
        total_max_size_mb: 768
        warning_watermark_percent: 80
        critical_watermark_percent: 90
        hard_watermark_percent: 100
        batch_guard_mb: 8
        cleanup_interval_minutes: 60
      config_descriptions:
        application_retention_days: "Retain application logs for this many days; 0 keeps them until application_max_size_mb trims them. Cloud Logging's _Default bucket keeps 30 days: set 30 to test that retention."
        application_max_size_mb: "Application-log storage budget in MiB. Past it the oldest entries are removed from memory and from PostgreSQL; 0 sets no budget and keeps every entry."
        runtime_retention_days: "Retain LocalCloud runtime logs for this many days; 0 keeps them until runtime_max_size_mb trims them."
        runtime_max_size_mb: "LocalCloud runtime-log storage budget in MiB. Past it the oldest runtime entries are removed; 0 sets no budget."
        raw_retention_hours: "Reserved and not enforced yet: container-local raw fallback logs are kept until the logging budgets trim them. 0 is the only value that matches current behaviour."
        raw_max_size_mb: "Container-local raw fallback-log storage budget in MiB."
        total_max_size_mb: "Hard combined budget for application, runtime, and raw logs in MiB."
        warning_watermark_percent: "Usage percentage that reports warning pressure."
        critical_watermark_percent: "Usage percentage that triggers aggressive runtime cleanup."
        hard_watermark_percent: "Usage percentage that requires synchronous reclamation or drops."
        batch_guard_mb: "Reserved headroom for one bounded batch, WAL, indexes, and rotation overhead."
        cleanup_interval_minutes: "Interval between background retention and budget cleanup passes."
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: logging, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

    monitoring:
      displayName: "Cloud Monitoring"
      availability: available
