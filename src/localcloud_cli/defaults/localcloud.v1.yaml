      terraformEnvVar: GOOGLE_REDIS_CUSTOM_ENDPOINT
      # Service-owned runtime settings — user-editable in localcloud.yaml and
      # applied by restarting this service (see service-runtime-config).
      config:
        max_memory: 512mb
        max_memory_policy: noeviction
        databases: 16
        append_fsync: everysec
      config_descriptions:
        max_memory: Valkey maxmemory ceiling (positive size with unit, e.g. 256mb, 1gb).
        max_memory_policy: Eviction policy when max_memory is reached (noeviction, allkeys-lru, allkeys-lfu, volatile-lru, volatile-lfu, allkeys-random, volatile-random, volatile-ttl).
        databases: Number of logical Valkey databases (positive integer).
        append_fsync: AOF fsync policy (everysec, always, no).
      observability:
