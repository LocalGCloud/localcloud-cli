    memorystore:
      displayName: "Memorystore (Redis/Valkey)"
      availability: available
      resettableData: true
      plaintextPort: 5390
      tlsPort: 5394
      protocol: redis
      envVar: REDIS_HOST
      gcloudApiName: redis
      envValuePrefix: ""
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: community
      terraformEnvVar: GOOGLE_REDIS_CUSTOM_ENDPOINT
      # Service-owned runtime settings — user-editable in localcloud.yaml and
      # applied by restarting this service.
      config:
        max_memory: 512mb
        max_memory_policy: noeviction
        databases: 16
        append_fsync: everysec
      config_descriptions:
        max_memory: Valkey maxmemory ceiling (positive size with unit, e.g. 256mb, 1gb).
        max_memory_policy: Eviction policy when max_memory is reached (noeviction, allkeys-lru, allkeys-lfu, volatile-lru, volatile-lfu, allkeys-random, volatile-random, volatile-ttl).
        databases: Number of logical Valkey databases (positive integer).
        append_fsync: AOF fsync policy (everysec, always, no).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: valkey
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: valkey
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/valkey-stdout.log
                stderr: /var/log/localcloud/valkey-stderr.log
              format: text
              retentionProfile: external-process

    workflows:
      displayName: "Cloud Workflows"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: WORKFLOWS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: workflows
      terraformEnvVar: GOOGLE_WORKFLOWS_CUSTOM_ENDPOINT
      config:
        executions_keep_per_workflow: 0
        operations_keep: 0
      config_descriptions:
        executions_keep_per_workflow: "Finished executions each workflow keeps, with their step history; 0 keeps every execution. A positive number keeps that many of the newest and deletes the rest when an execution starts and at startup."
        operations_keep: "Workflow operations the service keeps across projects; 0 keeps every operation. A positive number keeps that many of the newest and deletes the rest."
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: workflows, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade}

