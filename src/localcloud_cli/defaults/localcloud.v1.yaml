      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: WORKFLOWS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: workflows
      terraformEnvVar: GOOGLE_WORKFLOWS_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: workflows, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade, integrationEvidence: localcloud-internal-sink, integrationTest: RuntimeServiceLogEmitterTest}

    vertexai:
      displayName: "Vertex AI"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: rest
      envVar: AIPLATFORM_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: false
      minTier: pro
      gcloudApiName: aiplatform
      terraformEnvVar: GOOGLE_VERTEX_AI_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: vertexai, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade, integrationEvidence: localcloud-internal-sink, integrationTest: RuntimeServiceLogEmitterTest}

    kms:
      displayName: "Cloud KMS"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc+rest
      envVar: CLOUD_KMS_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: pro
      gcloudApiName: cloudkms
      terraformEnvVar: GOOGLE_KMS_CUSTOM_ENDPOINT
      config:
        root_key_file: /var/lib/localcloud/kms/kms-root.key
        lifecycle_poll_interval_ms: 1000
      config_descriptions:
        root_key_file: Absolute container path to the LocalCloud KMS root key. The default is protected by the persistent state volume; an explicit external path such as /etc/localcloud/kms-root.key must be backed up separately.
        lifecycle_poll_interval_ms: Poll interval for durable key rotation, scheduled destruction, and ImportJob expiry processing. Valid range is 100 to 60000 milliseconds.
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: kms, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade, integrationEvidence: localcloud-internal-sink, integrationTest: RuntimeServiceLogEmitterTest}

    cloudsql:
      displayName: "Cloud SQL"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: rest
      envVar: CLOUD_SQL_EMULATOR_HOST
      envValuePrefix: "http://"
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: sqladmin
      terraformEnvVar: GOOGLE_SQL_CUSTOM_ENDPOINT
      additionalPorts:
        postgres: 5375
        mysql: 5376 # MySQL 8.4 LTS, container started on demand
      # Service-owned runtime settings for the shared Cloud SQL MySQL data plane
      # (one localcloud-mysql container hosts every MYSQL_* instance). User-editable in
      # localcloud.yaml, applied by restarting Cloud SQL.
      config:
        mysql_enabled: true
        mysql_autostart: false
        mysql_image: jaysen2apache/mysql:8.4
        mysql_max_connections: 50
        mysql_innodb_buffer_pool_size: 64M
        mysql_table_open_cache: 200
      config_descriptions:
        mysql_enabled: Enable MySQL engine support in Cloud SQL (boolean). When false, only PostgreSQL instances can be created.
        mysql_autostart: Automatically pull and start the MySQL companion container on LocalCloud boot if mysql_enabled is true (boolean). If false, container starts lazily on demand or via UI.
        mysql_image: Container image for the Cloud SQL MySQL data plane.
        mysql_max_connections: Maximum client connections to the shared Cloud SQL MySQL server (positive integer).
        mysql_innodb_buffer_pool_size: InnoDB buffer pool size for the shared Cloud SQL MySQL server (positive size with unit, e.g. 64M, 256M).
        mysql_table_open_cache: Table cache size for the shared Cloud SQL MySQL server (positive integer).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: cloudsql, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade, integrationEvidence: localcloud-internal-sink, integrationTest: RuntimeServiceLogEmitterTest}

infrastructure:
  dns:
    displayName: "LocalCloud DNS"
    port: 5378
    protocol: udp

# Image-owned operational sources that do not represent user-facing GCP services.
observability:
  infrastructure:
    postgresql:
      logs:
        resourceType: localcloud_service
        sources:
          - id: database-process
            component: postgresql
            strategy: collector
            fallback: raw-only
            kind: supervisor
            program: postgresql
            streams: [stdout, stderr]
            paths:
              stdout: /var/log/localcloud/postgresql-stdout.log
              stderr: /var/log/localcloud/postgresql-stderr.log
            format: text
            retentionProfile: infrastructure
            integrationEvidence: docker/postgres-start.sh
            integrationTest: RuntimeLogCollectorTest
    supervisor:
      logs:
        resourceType: localcloud_service
        sources:
          - id: supervisor-activity
            component: supervisord
            strategy: collector
            fallback: raw-only
            kind: file
            paths:
              activity: /var/log/localcloud/supervisord.log
            format: text
            retentionProfile: infrastructure
            integrationEvidence: docker/conf/supervisord.conf
            integrationTest: RuntimeLogCollectorTest
    dns:
      logs:
        resourceType: localcloud_service
        sources:
          - id: dns-process
            component: dnsmasq
            strategy: collector
            fallback: raw-only
            kind: supervisor
            program: dnsmasq
            streams: [stdout, stderr]
            paths:
              stdout: /var/log/localcloud/dnsmasq.out.log
              stderr: /var/log/localcloud/dnsmasq.err.log
            format: text
            retentionProfile: infrastructure
            integrationEvidence: docker/conf/network/dnsmasq.conf
            integrationTest: RuntimeLogCollectorTest
