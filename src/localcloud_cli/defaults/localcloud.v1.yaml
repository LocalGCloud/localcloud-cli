# LocalCloud unified configuration defaults
# Canonical server, service-catalog, and infrastructure settings packaged with
# the JAR and Docker image. localcloud.yaml is a recursive overlay; mapping
# members set to null are deleted before the effective document is validated.
# Read by: Java (Jackson/SnakeYAML), Python (PyYAML), and repository tooling.

version: 1

context:
  project: local-gcp-project

host:
  transparent_network: false
  data_volume: localcloud-data
  backup_dir: ~/.localcloud/backups
  data: persistent
  docker_socket: auto
  network_name: localcloud

tls:
  enabled: false
  port: 5379
  certificate: ""
  private_key: ""

mcp:
  write: false
  destructive: false
  allow_remote: false

updater:
  enabled: true
  auto_update: false
  auto_restart_container: false
  check_interval_hours: 24
  image: jaysen2apache/localcloud:latest
  prune_old_image: true
  drain_timeout_seconds: 5

server:
  data_dir: /var/lib/localcloud
  gateway:
    port: 5365
  logging:
    verbosity: info
  persistence: true
  auto_seed: true
  gcp_credentials:
    source: none
    adc_path: /credentials/adc/application_default_credentials.json
    sa_key_path: /credentials/sa-key.json
  postgres:
    host: localhost
    port: 5375
    database: localcloud
    user: localcloud
    password: localcloud
  api_key: ""
  license_server_url: none

services:
  enabled: default
  catalog:
    gcs:
      displayName: "Cloud Storage"
      availability: available
      resettableData: true
      plaintextPort: 5366
      tlsPort: 5380
      protocol: rest
      envVar: STORAGE_EMULATOR_HOST
      envValuePrefix: "http://"
      type: external
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: storage
      terraformEnvVar: GOOGLE_STORAGE_CUSTOM_ENDPOINT
      healthCheck:
        type: tcp
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: fake-gcs-server
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: fake-gcs-server
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/fake-gcs-server-stdout.log
                stderr: /var/log/localcloud/fake-gcs-server-stderr.log
              format: text
              retentionProfile: external-process
              integrationEvidence: docker/gcs-start.sh
              integrationTest: RuntimeLogCollectorTest

    pubsub:
      displayName: "Pub/Sub"
      availability: available
      resettableData: true
      plaintextPort: 5367
      tlsPort: 5381
      protocol: grpc
      envVar: PUBSUB_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: pubsub
      terraformEnvVar: GOOGLE_PUBSUB_CUSTOM_ENDPOINT
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: java-runtime
              component: pubsub
              strategy: direct
              fallback: raw-only
              kind: internal
              paths:
                raw: /var/log/localcloud/localcloud-server.log
              format: json
              retentionProfile: java-facade
              integrationEvidence: localcloud-internal-sink
              integrationTest: RuntimeServiceLogEmitterTest

    firestore:
      displayName: "Firestore"
      availability: available
      resettableData: true
      plaintextPort: 5368
      protocol: grpc
      envVar: FIRESTORE_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: false
      # Firestore emulator seeding is not implemented yet (SeedService skips it) —
      # keep disabled by default. Firestore is also outside whole-volume
      # recovery v1; snapshot preflight rejects it when enabled or running.
      defaultEnabled: false
      minTier: community
      gcloudApiName: firestore
      terraformEnvVar: GOOGLE_FIRESTORE_CUSTOM_ENDPOINT
      healthCheck:
        type: http
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: firestore-emulator
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: firestore-emulator
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/firestore-emulator-stdout.log
                stderr: /var/log/localcloud/firestore-emulator-stderr.log
              format: text
              retentionProfile: external-process
              integrationEvidence: docker/conf/supervisord.conf
              integrationTest: RuntimeLogCollectorTest

    bigtable:
      displayName: "Bigtable"
      availability: available
      resettableData: true
      plaintextPort: 5369
      protocol: grpc
      envVar: BIGTABLE_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: true
      defaultEnabled: true
      minTier: pro
      # No gcloudApiName: Bigtable emulator is gRPC data-plane only; gcloud bigtable
      # commands use the bigtableadmin REST API which the emulator does not serve.
      terraformEnvVar: GOOGLE_BIGTABLE_CUSTOM_ENDPOINT
      healthCheck:
        type: tcp
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: bigtable-emulator
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: bigtable-emulator
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/bigtable-emulator-stdout.log
                stderr: /var/log/localcloud/bigtable-emulator-stderr.log
              format: text
              retentionProfile: external-process
              integrationEvidence: docker/bigtable-connect.sh
              integrationTest: RuntimeLogCollectorTest

    spanner:
      displayName: "Spanner"
      availability: available
      resettableData: true
      plaintextPort: 5370
      protocol: grpc
      envVar: SPANNER_EMULATOR_HOST
      envValuePrefix: ""
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: pro
      gcloudApiName: spanner
      gcloudPort: 5371
      terraformEnvVar: GOOGLE_SPANNER_CUSTOM_ENDPOINT
      additionalPorts:
        rest: 5371
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: spanner-emulator
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: spanner-emulator
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/spanner-emulator-stdout.log
                stderr: /var/log/localcloud/spanner-emulator-stderr.log
              format: text
              retentionProfile: external-process
              integrationEvidence: docker/conf/supervisord.conf
              integrationTest: RuntimeLogCollectorTest
      healthCheck:
        type: http
        port: 5371
        path: "/v1/projects/{projectId}/instances"
      # Service-owned runtime settings — user-editable in localcloud.yaml and
      # applied by restarting this service (see service-runtime-config).
      config:
        backup_enabled: false
        backup_interval_seconds: 60
      config_descriptions:
        backup_enabled: Retired compatibility setting. Periodic live LevelDB backup is not started; use the explicit host whole-volume snapshot command.
        backup_interval_seconds: Retired compatibility setting retained for older overlays (positive integer, >= 10; no scheduler is started).

    bigquery:
      displayName: "BigQuery"
      availability: available
      resettableData: true
      plaintextPort: 5372
      tlsPort: tls
      protocol: rest
      envVar: BIGQUERY_EMULATOR_HOST
      envValuePrefix: "http://"
      type: external
      gatewayObservable: false
      defaultEnabled: true
      minTier: community
      gcloudApiName: bigquery
      terraformEnvVar: GOOGLE_BIGQUERY_CUSTOM_ENDPOINT
      grpcPort: 5373
      healthCheck:
        type: http
        path: "/bigquery/v2/projects/{projectId}/datasets"
      # Service-owned runtime settings — user-editable in localcloud.yaml and
      # applied by restarting this service (see service-runtime-config).
      config:
        memory_limit: 512MB
        threads: 2
        log_level: info
      config_descriptions:
        memory_limit: Maximum DuckDB memory available to BigQuery queries (positive size with unit, e.g. 512MB, 2GB).
        threads: Maximum worker threads used to execute BigQuery queries (positive integer).
        log_level: BigQuery emulator log verbosity (debug, info, warn, error).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - id: emulator-process
              component: bigquery-emulator
              strategy: collector
              fallback: raw-only
              kind: supervisor
              program: bigquery-emulator
              streams: [stdout, stderr]
              paths:
                stdout: /var/log/localcloud/bigquery-emulator-stdout.log
                stderr: /var/log/localcloud/bigquery-emulator-stderr.log
              format: json
              retentionProfile: external-process
              integrationEvidence: docker/bigquery-start.sh
              integrationTest: RuntimeLogCollectorTest


