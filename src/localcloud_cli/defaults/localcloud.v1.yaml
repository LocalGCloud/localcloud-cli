      defaultEnabled: true
      minTier: community
      gcloudApiName: iam
      terraformEnvVar: GOOGLE_IAM_CUSTOM_ENDPOINT
      # Service-owned runtime settings (moved from server.iam). User-editable in
      # localcloud.yaml and applied by restarting Cloud IAM.
      config:
        mode: open
        policy_file: ""
        log_warnings: true
      config_descriptions:
        mode: IAM mode — 'open' silently allows requests, 'permissive' allows requests with decision logging, 'strict' enforces local policy, and 'gcp-live' delegates authorization to real GCP IAM.
        policy_file: Optional IAM policy JSON file; strict mode with no file denies every non-management request.
        log_warnings: Log Cloud IAM operation warnings when enabled; suppressed in open mode (boolean).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
