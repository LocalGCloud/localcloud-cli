    logging:
      displayName: "Cloud Logging"
      availability: available
      resettableData: true
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: CLOUD_LOGGING_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: logging
      terraformEnvVar: GOOGLE_LOGGING_CUSTOM_ENDPOINT
      config:
        application_retention_days: 7
        application_max_size_mb: 512
        runtime_retention_days: 3
        runtime_max_size_mb: 128
        raw_retention_hours: 24
        raw_max_size_mb: 128
        total_max_size_mb: 768
        warning_watermark_percent: 80
        critical_watermark_percent: 90
        hard_watermark_percent: 100
        batch_guard_mb: 8
        cleanup_interval_minutes: 60
      config_descriptions:
        application_retention_days: "Retain application logs for this many days."
        application_max_size_mb: "Protected application-log storage budget in MiB."
        runtime_retention_days: "Retain LocalCloud runtime logs for this many days."
        runtime_max_size_mb: "LocalCloud runtime-log storage budget in MiB."
        raw_retention_hours: "Retain container-local raw fallback logs for this many hours."
        raw_max_size_mb: "Container-local raw fallback-log storage budget in MiB."
        total_max_size_mb: "Hard combined budget for application, runtime, and raw logs in MiB."
        warning_watermark_percent: "Usage percentage that reports warning pressure."
        critical_watermark_percent: "Usage percentage that triggers aggressive runtime cleanup."
        hard_watermark_percent: "Usage percentage that requires synchronous reclamation or drops."
        batch_guard_mb: "Reserved headroom for one bounded batch, WAL, indexes, and rotation overhead."
        cleanup_interval_minutes: "Interval between background retention and budget cleanup passes."
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: logging, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade, integrationEvidence: localcloud-internal-sink, integrationTest: RuntimeServiceLogEmitterTest}

