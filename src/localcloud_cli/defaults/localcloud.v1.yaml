    dataproc:
      displayName: "Dataproc"
      availability: available
      resettableData: true
      runtimeDependencies: [docker]
      plaintextPort: gateway
      tlsPort: tls
      protocol: grpc
      envVar: DATAPROC_EMULATOR_HOST
      envValuePrefix: ""
      type: facade
      gatewayObservable: true
      defaultEnabled: true
      minTier: community
      gcloudApiName: dataproc
      terraformEnvVar: GOOGLE_DATAPROC_CUSTOM_ENDPOINT
      # Service-owned runtime settings (moved from server.dataproc_registry).
      # User-editable in localcloud.yaml and applied by restarting Dataproc.
      config:
        registry: jaysen2apache/dataproc
        prefer_native: true
      config_descriptions:
        registry: Container registry / repository prefix for Dataproc cluster images (non-blank).
        prefer_native: Prefer platform-native Dataproc images over QEMU-emulated generic images when available (boolean).
      observability:
        logs:
          resourceType: localcloud_service
          sources:
            - {id: java-runtime, component: dataproc, strategy: direct, fallback: raw-only, kind: internal, paths: {raw: /var/log/localcloud/localcloud-server.log}, format: json, retentionProfile: java-facade, integrationEvidence: localcloud-internal-sink, integrationTest: RuntimeServiceLogEmitterTest}

    cloudiam:
