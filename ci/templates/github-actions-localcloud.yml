name: LocalCloud CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-with-localcloud:
    runs-on: ubuntu-latest

    services:
      localcloud:
        image: localcloud/localcloud:latest
        ports:
          - 8080:8080
          - 4443:4443
          - 8085:8085
          - 8086:8086
          - 8087:8087
          - 9010:9010
          - 9020:9020
          - 9050:9050
          - 9060:9060
          - 6379:6379
        env:
          LOCALCLOUD_PROJECT: local-project
          LOCALCLOUD_SERVICES: gcs,pubsub,firestore,bigquery,secretmanager,cloudtasks,logging,monitoring,memorystore,workflows
        options: >-
          --memory 4g
          --health-cmd "curl -fsS http://localhost:8080/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Wait for LocalCloud
        run: |
          chmod +x ci/templates/wait-for-localcloud.sh
          LOCALCLOUD_WAIT_SERVICES=gcs,pubsub,bigquery,secretmanager,cloudtasks \
            ci/templates/wait-for-localcloud.sh

      - name: Export LocalCloud environment
        run: curl -fsS "http://localhost:8080/env?format=shell" >> "$GITHUB_ENV"

      - name: Assert LocalCloud coverage
        run: |
          ci/templates/assert-localcloud-coverage.py \
            --services gcs,pubsub,bigquery,secretmanager,cloudtasks \
            --min-status partial

      - name: Seed test data
        if: hashFiles('seed.yaml') != ''
        run: curl -fsS -X POST "http://localhost:8080/seed" --data-binary @seed.yaml

      - name: Create pre-test snapshot
        run: |
          curl -fsS -X POST "http://localhost:8080/snapshots" \
            -H "Content-Type: application/json" \
            -d '{"name":"pre-test","replace_existing":true}'

      - name: Run application tests
        run: ./gradlew test

      - name: Export diagnostics on failure
        if: failure()
        run: |
          curl -fsS "http://localhost:8080/diagnostics?limit=200" > localcloud-diagnostics.json || true
          curl -fsS "http://localhost:8080/diagnostics/archive?limit=200" > localcloud-diagnostics.zip || true

      - name: Upload LocalCloud diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localcloud-diagnostics
          path: |
            localcloud-diagnostics.json
            localcloud-diagnostics.zip
