services:
  localcloud:
    image: localcloud/localcloud:latest
    container_name: localcloud-ci
    mem_limit: 4g
    ports:
      - "8080:8080"
      - "4443:4443"
      - "8085:8085"
      - "8086:8086"
      - "8087:8087"
      - "9010:9010"
      - "9020:9020"
      - "9050:9050"
      - "9060:9060"
      - "6379:6379"
    environment:
      LOCALCLOUD_PROJECT: local-project
      LOCALCLOUD_SERVICES: gcs,pubsub,firestore,bigquery,secretmanager,cloudtasks,logging,monitoring,memorystore,workflows
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
