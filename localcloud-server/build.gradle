plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.localcloud'
version = '0.1.0-SNAPSHOT'
description = 'LocalCloud - Local GCP Emulator Server'

ext {
    author = 'Jay Sen'
    authorEmail = 'jaysen@apache.org'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

def armeriaVersion = '1.31.3'
def grpcVersion = '1.68.2'
def jacksonVersion = '2.17.0'
dependencies {
    // Armeria BOM for dependency alignment
    implementation platform("com.linecorp.armeria:armeria-bom:${armeriaVersion}")
    implementation "com.linecorp.armeria:armeria"
    implementation "com.linecorp.armeria:armeria-grpc"

    // Facade service stubs (services we implement ourselves)
    implementation 'com.google.api.grpc:proto-google-cloud-secretmanager-v1:2.86.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-secretmanager-v1:2.86.0'
    implementation 'com.google.api.grpc:proto-google-cloud-tasks-v2:2.86.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-tasks-v2:2.86.0'
    implementation 'com.google.api.grpc:proto-google-cloud-logging-v2:0.116.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-logging-v2:0.116.0'
    implementation 'com.google.api.grpc:proto-google-cloud-monitoring-v3:3.87.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-monitoring-v3:3.87.0'

    // GKE Container API stubs
    implementation 'com.google.api.grpc:proto-google-cloud-container-v1:2.55.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-container-v1:2.55.0'

    // Cloud Run v2 API stubs
    implementation 'com.google.api.grpc:proto-google-cloud-run-v2:0.58.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-run-v2:0.58.0'

    // Cloud Workflows API stubs
    implementation 'com.google.api.grpc:proto-google-cloud-workflows-v1:2.64.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-workflows-v1:2.64.0'
    implementation 'com.google.api.grpc:proto-google-cloud-workflow-executions-v1:2.64.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-workflow-executions-v1:2.64.0'

    // Bigtable external emulator admin/data clients
    implementation 'com.google.api.grpc:proto-google-cloud-bigtable-v2:2.70.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-bigtable-v2:2.70.0'
    implementation 'com.google.api.grpc:proto-google-cloud-bigtable-admin-v2:2.70.0'
    implementation 'com.google.api.grpc:grpc-google-cloud-bigtable-admin-v2:2.70.0'

    // Docker Java client
    implementation 'com.github.docker-java:docker-java-core:3.3.6'
    implementation 'com.github.docker-java:docker-java-transport-httpclient5:3.3.6'

    // gRPC
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"

    // PostgreSQL JDBC driver
    implementation 'org.postgresql:postgresql:42.7.3'

    // HikariCP
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Netty Redis codec (aligned with Netty version from Armeria)
    implementation 'io.netty:netty-codec-redis:4.1.115.Final'

    // SLF4J + Logback
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'

    // JUnit 5 + Mockito
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Integration test dependencies
    testImplementation "com.linecorp.armeria:armeria-junit5"
    testImplementation 'com.h2database:h2:2.2.224'
}

application {
    mainClass = 'com.localcloud.LocalCloudApplication'
}

shadowJar {
    archiveBaseName.set('localcloud-server')
    archiveClassifier.set('all')
    archiveVersion.set(project.version.toString())
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

test {
    useJUnitPlatform()
}

processResources {
    from('../services.yaml') {
        into '.'
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
