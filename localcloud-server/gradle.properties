# Suppress native-access warnings from Gradle's native-platform library on Java 21+
# This applies to the Gradle daemon JVM. The client-side warning is a known
# Gradle 8.x issue (https://github.com/gradle/gradle/issues/27035) and will
# be resolved when Gradle 9.0 is released.
org.gradle.jvmargs=-Xmx512m --enable-native-access=ALL-UNNAMED
