    type: manual
    date: 2026-06-22
    source: localcloud-server/src/main/java/com/localcloud/emulators/bigtable/BigtableEmulator.java
    command: Verify BigtableEmulator gRPC service extends UnimplementedBigtableServer concrete type rather than embedding the interface.
    expected: New proto methods (PingAndWarm, ExecuteQuery, etc.) safely return codes.Unimplemented instead of panicking at runtime.
