    command: Run cbt CLI with BIGTABLE_EMULATOR_HOST env var. Test instance CRUD (create/list/get/delete), table CRUD, and row read/write operations.
    expected: All cbt CLI commands succeed against the emulator.
  - id: manual:sdk-e2e
    type: manual
    date: 2026-06-22
    source: localcloud-server/src/test/java/com/localcloud/emulators/bigtable
    command: Run Bigtable Java SDK client against the emulator endpoint. Exercise ReadRows, MutateRow, MutateRows, CheckAndMutateRow, ReadModifyWriteRow, SampleRowKeys.
    expected: All SDK data-plane methods complete without errors against the emulator.
