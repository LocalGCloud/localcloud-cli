service_id: bigquery
coverage_status: partial
operations:
  - id: datasets.lifecycle
    operation: datasets.create/list/delete
    status: supported
    evidence: [manual:service-status-2026-05-26, terraform:api-compat-script]
  - id: tables.lifecycle
    operation: tables.create/list/delete
    status: supported
    evidence: [manual:service-status-2026-05-26, terraform:api-compat-script]
  - id: sql.query
    operation: SELECT, JOIN, window functions, CTEs, PIVOT/UNPIVOT, MERGE
    status: partial
    notes: |
      DuckDB-backed via SQLGlot transpiler. ~96% BigQuery SQL coverage, 175+ functions.
      958 tests passing. Key gaps: GROUP BY ROLLUP/CUBE/GROUPING SETS, SEMI/ANTI JOIN,
      BQML (clear error), AEAD encryption, KLL quantiles, graph queries, continuous queries.
      ⚠ Type coercion risk: DuckDB is permissive where BigQuery is strict — queries that
      work locally may error in production. Division by zero returns Inf instead of error.
      GEOGRAPHY: 12 ST_* functions with haversine approximation (not true geodesic).
  - id: sql.scripting
    operation: DECLARE, SET, IF/WHILE/LOOP, BEGIN/EXCEPTION, CALL, EXECUTE IMMEDIATE
    status: partial
    notes: Full scripting interpreter with variable scoping, BREAK/CONTINUE, RAISE, transactions.
  - id: materialized-views
    operation: CREATE MATERIALIZED VIEW, auto-refresh
    status: partial
    notes: Supported in emulator with PARTITION BY, CLUSTER BY, OPTIONS.
  - id: external-tables
    operation: query Parquet/CSV/JSON files (local + GCS)
    status: partial
    notes: CREATE EXTERNAL TABLE with format/uris options. Object tables not supported.
  - id: storage-api
    operation: gRPC Storage Read/Write API (AVRO + Arrow)
    status: partial
    notes: gRPC endpoint on port 24088. ReadRows with streaming support.
  - id: information-schema
    operation: INFORMATION_SCHEMA views
    status: partial
    notes: "11 views: COLUMNS, TABLES, SCHEMATA, PARTITIONS, VIEWS, ROUTINES, TABLE_OPTIONS, TABLE_STORAGE, JOBS_BY_*, COLUMN_FIELD_PATHS."
