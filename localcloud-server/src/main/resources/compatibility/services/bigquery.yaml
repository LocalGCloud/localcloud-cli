  - { id: bq-ml-predict, surface: sql, keyword: ML.PREDICT, severity: warning, message: ML functions are not available in the emulator., evidence: [manual:sql-warnings-2026-04-20] }
  - { id: bq-ml-evaluate, surface: sql, keyword: ML.EVALUATE, severity: warning, message: ML functions are not available in the emulator., evidence: [manual:sql-warnings-2026-04-20] }
  - { id: bq-ml-training-info, surface: sql, keyword: ML.TRAINING_INFO, severity: warning, message: ML functions are not available in the emulator., evidence: [manual:sql-warnings-2026-04-20] }
  - { id: bq-ml-feature-info, surface: sql, keyword: ML.FEATURE_INFO, severity: warning, message: ML functions are not available in the emulator., evidence: [manual:sql-warnings-2026-04-20] }
  - { id: bq-bignumeric, surface: sql, keyword: BIGNUMERIC, severity: warning, message: Truncated to DECIMAL(38,9). Use NUMERIC or FLOAT64 for full compatibility., evidence: [manual:sql-warnings-2026-04-20] }
  - { id: bq-time-travel, surface: sql, keyword: FOR SYSTEM_TIME AS OF, severity: warning, message: Time travel is not supported in the emulator., evidence: [manual:sql-warnings-2026-04-20] }
  - { id: bq-assert-rows, surface: sql, keyword: ASSERT_ROWS_MODIFIED, severity: warning, message: ASSERT_ROWS_MODIFIED is not supported by the emulator., evidence: [manual:sql-warnings-2026-04-20] }
  - { id: bq-tablesample, surface: sql, keyword: TABLESAMPLE, severity: warning, message: TABLESAMPLE is not supported., workaround: Use LIMIT with ORDER BY RANDOM() instead., evidence: [manual:sql-warnings-2026-04-20] }
ci_recommendation: ~96% BigQuery SQL coverage. Suitable for local development and CI. Be aware of DuckDB type coercion differences vs production BigQuery strict typing.
