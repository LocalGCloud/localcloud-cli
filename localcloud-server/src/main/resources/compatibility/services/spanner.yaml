service_id: spanner
coverage_status: partial
operations:
  - id: admin.lifecycle
    operation: instances/databases
    status: supported
    evidence: [manual:service-status-2026-05-26, terraform:api-compat-script]
  - id: ddl-dml
    operation: DDL, SQL/DML queries, transactions
    status: supported
    evidence: [manual:service-status-2026-05-26, terraform:e2e-script]
    notes: |
      Google's official Cloud Spanner Emulator (C++, ZetaSQL-backed). Full DDL (CREATE TABLE,
      ALTER TABLE, indexes, foreign keys, check constraints, generated columns). Full SQL/DML
      (SELECT, INSERT, UPDATE, DELETE). Partitioned Read, Partitioned Query, and Partitioned DML
      APIs. Read-only and read-write transactions. NUMERIC, JSON, PostgreSQL interface via PGAdapter.
      This fork adds LevelDB persistence (upstream is in-memory only).
      Change streams not supported. MERGE and TABLESAMPLE not supported.
terraform_resources:
  status: supported
  resources: [google_spanner_instance, google_spanner_database]
  evidence: [manual:terraform-compat-2026-05-31, terraform:e2e-script]
gcloud_paths:
  - id: gcloud.spanner
    status: partial
console_paths:
  - id: data-browser
    status: partial
state:
  source: external emulator
  seed: available
  reset: available
  export: available
  snapshot: planned
limitations:
  - Google's official emulator — full DDL, full SQL/DML, Partitioned DML, transactions, secondary indexes, foreign keys, generated columns, JSON type, NUMERIC type, check constraints all supported.
  - Change streams not supported.
warnings:
  - id: spanner-pending-commit-timestamp
    surface: sql
    keyword: PENDING_COMMIT_TIMESTAMP
    severity: warning
    message: Use CURRENT_TIMESTAMP instead.
    evidence: [manual:sql-warnings-2026-04-20]
  - id: spanner-merge
    surface: sql
    keyword: MERGE
    severity: warning
    message: MERGE is not supported by the Spanner emulator.
    workaround: Use separate INSERT, UPDATE, or DELETE statements.
    evidence: [manual:sql-warnings-2026-04-20]
  - id: spanner-tablesample
    surface: sql
    keyword: TABLESAMPLE
    severity: warning
    message: TABLESAMPLE is not supported by the Spanner emulator.
    evidence: [manual:sql-warnings-2026-04-20]
ci_recommendation: Google's official emulator with full SQL/DML fidelity. Suitable for local development and CI. Use with gcloud emulators spanner start or the forked Docker image for LevelDB persistence.
