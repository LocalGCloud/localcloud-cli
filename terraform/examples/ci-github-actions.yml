# GitHub Actions workflow: Test Terraform against LocalCloud
#
# This workflow starts a LocalCloud container, points Terraform at it,
# and runs plan/apply/destroy to verify infrastructure code works.

name: Terraform Integration Test

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '*.tf'
  workflow_dispatch:

jobs:
  terraform-test:
    runs-on: ubuntu-latest
    services:
      localcloud:
        image: localcloud/localcloud:latest
        ports:
          - 8080:8080
          - 4443:4443
          - 8085:8085
          - 8086:8086
          - 8087:8087
          - 9010:9010
          - 9020:9020
          - 9050:9050
          - 6379:6379
        options: --memory 4g --health-cmd "curl -f http://localhost:8080/_localcloud/health" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Wait for LocalCloud
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/_localcloud/health > /dev/null; then
              echo "LocalCloud is ready"
              break
            fi
            sleep 2
          done

      - name: Configure Terraform for LocalCloud
        run: eval $(curl -s http://localhost:8080/_localcloud/env?format=terraform) >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: terraform/examples
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/examples
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/examples
        run: terraform apply -auto-approve tfplan

      - name: Verify Resources Created
        run: |
          echo "Checking GCS bucket..."
          curl -sf http://localhost:4443/storage/v1/b/terraform-test-bucket
          echo "Checking Pub/Sub topic..."
          curl -sf http://localhost:8085/v1/projects/local-project/topics/terraform-test-topic
          echo "Checking BigQuery dataset..."
          curl -sf http://localhost:9050/bigquery/v2/projects/local-project/datasets/terraform_test_dataset

      - name: Terraform Destroy
        working-directory: terraform/examples
        if: always()
        run: terraform destroy -auto-approve
