name: Release LocalCloud CLI

on:
  workflow_dispatch:
    inputs:
      force:
        description: Delete and recreate an existing release without deleting its tag
        required: false
        default: false
        type: boolean
concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNTIME_IMAGE: jaysen2apache/localcloud:latest
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release identity
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      release_date: ${{ steps.version.outputs.release_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve the annotated tag object instead of fetching its peeled
          # github.sha commit back into refs/tags/<tag>.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Match tag and CLI version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              ).stdout.strip()

          if os.environ.get("GITHUB_REF_TYPE") != "tag":
              raise SystemExit("run the release workflow from an existing vX.Y.Z tag")
          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)", tag)
          if match is None:
              raise SystemExit(f"release tag must have the form vX.Y.Z, got {tag!r}")
          version = match.group(1)
          source = Path("src/localcloud_cli/__init__.py").read_text(encoding="utf-8")
          source_match = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          if source_match is None:
              raise SystemExit("localcloud_cli.__version__ is missing")
          if source_match.group(1) != version:
              raise SystemExit(
                  f"tag {tag!r} does not match CLI version {source_match.group(1)!r}"
              )
          tag_ref = f"refs/tags/{tag}"
          if git("cat-file", "-t", tag_ref) != "tag":
              raise SystemExit(f"release tag {tag!r} must be annotated")
          release_commit_full = git("rev-parse", f"{tag_ref}^{{commit}}")
          if git("rev-parse", "HEAD") != release_commit_full:
              raise SystemExit(f"checked-out HEAD does not match release tag {tag!r}")
          release_commit = release_commit_full[:12]
          release_date = git(
              "for-each-ref", "--format=%(taggerdate:short)", tag_ref
          )
          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", release_date) is None:
              raise SystemExit(f"release tag {tag!r} has no valid tagger date")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"release_commit={release_commit}\n")
              output.write(f"release_date={release_date}\n")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test release source without Docker integration
        run: uv run --frozen --extra test python -m pytest -q -m "not docker"

      - name: Verify generated notices
        run: |
          uv run --frozen --extra release python scripts/generate-third-party-notices.py
          git diff --exit-code -- THIRD_PARTY_NOTICES

  build-native:
    name: Build ${{ matrix.asset }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            expected_machine: arm64
            asset: localcloud-darwin-arm64.tar.gz
          - runner: macos-15-intel
            expected_machine: x86_64
            asset: localcloud-darwin-amd64.tar.gz
          - runner: ubuntu-22.04-arm
            expected_machine: aarch64
            asset: localcloud-linux-arm64.tar.gz
          - runner: ubuntu-22.04
            expected_machine: x86_64
            asset: localcloud-linux-amd64.tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4

      - name: Require native architecture
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked release dependencies
        run: uv sync --frozen --extra release

      - name: Smoke Python command aliases
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          canonical_version=$(uv run --frozen localcloud --version)
          alias_version=$(uv run --frozen lc --version)
          test "$canonical_version" = "localcloud ${VERSION}"
          test "$alias_version" = "$canonical_version"

      - name: Build one-folder executable bundle
        env:
          LOCALCLOUD_RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
          LOCALCLOUD_RELEASE_DATE: ${{ needs.validate-release.outputs.release_date }}
        run: |
          uv run --frozen --extra release python -m PyInstaller --clean --noconfirm localcloud.spec
          install -m 0755 scripts/localcloud-launcher.sh dist/localcloud

      - name: Smoke frozen executable
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
          RELEASE_DATE: ${{ needs.validate-release.outputs.release_date }}
        run: |
          expected="localcloud ${VERSION} (commit ${RELEASE_COMMIT}, released ${RELEASE_DATE})"
          test "$(./dist/localcloud --version)" = "$expected"
          ./dist/localcloud --help >/dev/null
          ./dist/localcloud guide >/dev/null

      - name: Verify prompt startup latency
        run: >-
          uv run --frozen python scripts/check-startup-feedback.py
          dist/localcloud --timeout 2.0

      - name: Package stable archive
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          stage="${RUNNER_TEMP}/localcloud-archive"
          mkdir -p "$stage"
          install -m 0755 dist/localcloud "$stage/localcloud"
          cp -RL dist/localcloud-runtime "$stage/localcloud-runtime"
          install -m 0644 LICENSE THIRD_PARTY_NOTICES "$stage/"
          test -x "$stage/localcloud-runtime/localcloud"
          test -z "$(find "$stage" -type l -print -quit)"
          test -z "$(find "$stage" -type f -links +1 -print -quit)"
          tar -C "$stage" -czf "$ASSET" \
            localcloud localcloud-runtime LICENSE THIRD_PARTY_NOTICES
          top_level=$(tar -tzf "$ASSET" | cut -d/ -f1 | LC_ALL=C sort -u | tr '\n' ' ')
          test "$top_level" = "LICENSE THIRD_PARTY_NOTICES localcloud localcloud-runtime "

      - name: Upload native archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish signed release
    needs: [validate-release, build-native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ needs.validate-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download native archives
        uses: actions/download-artifact@v4
        with:
          pattern: localcloud-*.tar.gz
          path: release-assets
          merge-multiple: true

      - name: Verify asset set and generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          expected="localcloud-darwin-amd64.tar.gz localcloud-darwin-arm64.tar.gz localcloud-linux-amd64.tar.gz localcloud-linux-arm64.tar.gz"
          actual=$(printf '%s\n' localcloud-*.tar.gz | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          test "$actual" = "$expected"
          sha256sum localcloud-darwin-amd64.tar.gz localcloud-darwin-arm64.tar.gz localcloud-linux-amd64.tar.gz localcloud-linux-arm64.tar.gz > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign release files
        shell: bash
        working-directory: release-assets
        run: |
          for asset in localcloud-*.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done

      - name: Render Homebrew formula
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          python3 scripts/render-homebrew-formula.py \
            --version "$VERSION" \
            --checksums release-assets/SHA256SUMS \
            --output release-assets/localcloud.rb
          ruby -c release-assets/localcloud.rb

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          IMAGE: ${{ env.RUNTIME_IMAGE }}
          FORCE_RELEASE: ${{ inputs.force }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
          RELEASE_DATE: ${{ needs.validate-release.outputs.release_date }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$FORCE_RELEASE" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
              exit 1
            fi
            echo "Deleting existing release $GITHUB_REF_NAME; preserving its tag."
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          printf "%s\n\n%s %s\n%s %s\n%s %s\n\n%s\n" \
            "LocalCloud CLI ${VERSION}" \
            "CLI source revision:" "$RELEASE_COMMIT" \
            "CLI release date:" "$RELEASE_DATE" \
            "Runtime Docker image:" "$IMAGE" \
            "Supported hosts: macOS 13+ and Linux with glibc 2.35+ (Ubuntu 22.04 equivalent)." \
            > release-notes.txt
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --title "LocalCloud CLI ${VERSION}" \
            --notes-file release-notes.txt \
            --verify-tag
