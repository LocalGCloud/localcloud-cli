attrs = { license = "MIT", source = "https://github.com/python-attrs/attrs" }
certifi = { license = "MPL-2.0", source = "https://github.com/certifi/python-certifi" }
cffi = { license = "MIT", source = "https://github.com/python-cffi/cffi" }
charset-normalizer = { license = "MIT", source = "https://github.com/jawah/charset_normalizer" }
click = { license = "BSD-3-Clause", source = "https://github.com/pallets/click" }
cryptography = { license = "Apache-2.0 OR BSD-3-Clause", source = "https://github.com/pyca/cryptography" }
docker = { license = "Apache-2.0", source = "https://github.com/docker/docker-py" }
h11 = { license = "MIT", source = "https://github.com/python-hyper/h11" }
httpcore = { license = "BSD-3-Clause", source = "https://github.com/encode/httpcore" }
