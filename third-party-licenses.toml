opentelemetry-api = { license = "Apache-2.0", source = "https://github.com/open-telemetry/opentelemetry-python" }
pycparser = { license = "BSD-3-Clause", source = "https://github.com/eliben/pycparser" }
pydantic = { license = "MIT", source = "https://github.com/pydantic/pydantic" }
pydantic-core = { license = "MIT", source = "https://github.com/pydantic/pydantic-core" }
