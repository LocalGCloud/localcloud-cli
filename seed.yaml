# LocalCloud Seed File
# Load on startup: localcloud start --seed seed.yaml
# Load manually: localcloud seed seed.yaml
# Schema based on schema.org/Person

version: "1.0"
project: "local-project"

personas:
  - name: "Jay Senjaliya"
    email: "JaySen@apache.com"
    role: "admin"

services:
  # Cloud Storage: buckets with uploaded files
  gcs:
    buckets:
      - name: "user-profiles"
        location: "US"
        objects:
          - key: "users/jay-senjaliya.json"
            content: '{"@type":"Person","name":"Jay Senjaliya","email":"JaySen@apache.com","jobTitle":"principal engineer","worksFor":"PayPal"}'
            contentType: "application/json"
          - key: "users/alice-johnson.json"
            content: '{"@type":"Person","name":"Alice Johnson","email":"alice@example.com","jobTitle":"Product Manager","worksFor":"Acme Corp"}'
            contentType: "application/json"
          - key: "users/bob-smith.json"
            content: '{"@type":"Person","name":"Bob Smith","email":"bob@example.com","jobTitle":"Software Engineer","worksFor":"TechCo"}'
            contentType: "application/json"
      - name: "app-assets"
        location: "US"
        objects:
          - key: "config/app-settings.json"
            content: '{"appName":"LocalCloud Demo","version":"1.0.0","environment":"development"}'
            contentType: "application/json"
          - key: "docs/welcome.txt"
            content: "Welcome to LocalCloud! Your local GCP development environment."
            contentType: "text/plain"

  # Pub/Sub: topics with subscriptions and messages
  pubsub:
    topics:
      - name: "user-events"
        subscriptions:
          - name: "user-events-processor"
            ackDeadlineSeconds: 30
        messages:
          - data: '{"event":"user.login","userId":"1","name":"Jay Senjaliya","timestamp":"2026-04-08T10:00:00Z"}'
            attributes: {"source": "auth-service", "type": "login"}
          - data: '{"event":"user.signup","userId":"4","name":"Carol Davis","timestamp":"2026-04-08T10:05:00Z"}'
            attributes: {"source": "auth-service", "type": "signup"}
          - data: '{"event":"user.profile-update","userId":"2","field":"email","timestamp":"2026-04-08T10:10:00Z"}'
            attributes: {"source": "profile-service", "type": "profile-update"}
          - data: '{"event":"user.password-change","userId":"1","timestamp":"2026-04-08T10:15:00Z"}'
            attributes: {"source": "auth-service", "type": "password-change"}
          - data: '{"event":"user.logout","userId":"3","name":"Bob Smith","timestamp":"2026-04-08T10:20:00Z"}'
            attributes: {"source": "auth-service", "type": "logout"}
      - name: "order-events"
        subscriptions:
          - name: "order-processor"
            ackDeadlineSeconds: 60
        messages:
          - data: '{"event":"order.created","orderId":"ord-001","customerId":"1","total":"149.99","timestamp":"2026-04-08T11:00:00Z"}'
            attributes: {"source": "order-service", "type": "created"}
          - data: '{"event":"order.confirmed","orderId":"ord-001","timestamp":"2026-04-08T11:05:00Z"}'
            attributes: {"source": "order-service", "type": "confirmed"}
          - data: '{"event":"order.shipped","orderId":"ord-001","carrier":"FedEx","tracking":"FX123456","timestamp":"2026-04-08T12:00:00Z"}'
            attributes: {"source": "shipping-service", "type": "shipped"}
          - data: '{"event":"order.delivered","orderId":"ord-001","timestamp":"2026-04-09T10:00:00Z"}'
            attributes: {"source": "shipping-service", "type": "delivered"}
          - data: '{"event":"order.created","orderId":"ord-002","customerId":"2","total":"89.50","timestamp":"2026-04-09T11:00:00Z"}'
            attributes: {"source": "order-service", "type": "created"}

