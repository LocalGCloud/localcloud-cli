    gcloudApiName: logging
    terraformEnvVar: GOOGLE_LOGGING_CUSTOM_ENDPOINT

  monitoring:
    displayName: "Cloud Monitoring"
    port: gateway
    protocol: grpc
    envVar: CLOUD_MONITORING_EMULATOR_HOST
    envValuePrefix: ""
    type: facade
    defaultEnabled: true
    minTier: community
    gcloudApiName: monitoring
    terraformEnvVar: GOOGLE_MONITORING_CUSTOM_ENDPOINT

  gke:
