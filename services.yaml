# LocalCloud Service Registry
# Single source of truth for all service definitions.
# Read by: Java (Jackson YAML), Python (PyYAML)
#
# Fields:
#   port: integer or "gateway" (resolved to gateway.port at load time)
#   protocol: "rest" or "grpc"
#   type: "external" (supervisord process) or "facade" (in-process on gateway)
#   envValuePrefix: "" for grpc (host:port), "http://" for rest (http://host:port)
#   additionalPorts: optional map of extra ports the service exposes
#   healthCheck: how to verify the external service is running
#   terraformEnvVar: Terraform Google provider GOOGLE_*_CUSTOM_ENDPOINT name

gateway:
  port: 8080

services:
  gcs:
    displayName: "Cloud Storage"
    port: 4443
    protocol: rest
    envVar: STORAGE_EMULATOR_HOST
    envValuePrefix: "http://"
    type: external
    defaultEnabled: true
    minTier: community
    gcloudApiName: storage
    terraformEnvVar: GOOGLE_STORAGE_CUSTOM_ENDPOINT
    healthCheck:
      type: tcp

  pubsub:
    displayName: "Pub/Sub"
    port: 8085
    protocol: grpc
    envVar: PUBSUB_EMULATOR_HOST
    envValuePrefix: ""
    type: external
    defaultEnabled: true
    minTier: community
    gcloudApiName: pubsub
    terraformEnvVar: GOOGLE_PUBSUB_CUSTOM_ENDPOINT
    healthCheck:
      type: http

  firestore:
    displayName: "Firestore"
    port: 8086
    protocol: grpc
    envVar: FIRESTORE_EMULATOR_HOST
    envValuePrefix: ""
    type: external
    defaultEnabled: true
    minTier: community
    gcloudApiName: firestore
    terraformEnvVar: GOOGLE_FIRESTORE_CUSTOM_ENDPOINT
    healthCheck:
      type: http

  bigtable:
    displayName: "Bigtable"
    port: 8087
    protocol: grpc
    envVar: BIGTABLE_EMULATOR_HOST
    envValuePrefix: ""
    type: external
    defaultEnabled: true
    minTier: pro
    # No gcloudApiName: Bigtable emulator is gRPC data-plane only; gcloud bigtable
    # commands use the bigtableadmin REST API which the emulator does not serve.
    terraformEnvVar: GOOGLE_BIGTABLE_CUSTOM_ENDPOINT
    healthCheck:
      type: tcp

  spanner:
    displayName: "Spanner"
    port: 9010
    protocol: grpc
    envVar: SPANNER_EMULATOR_HOST
    envValuePrefix: ""
    type: external
    defaultEnabled: true
    minTier: pro
    gcloudApiName: spanner
    gcloudPort: 9020
    terraformEnvVar: GOOGLE_SPANNER_CUSTOM_ENDPOINT
    persistence: true
    dataDir: "/var/lib/localcloud/spanner-data"
    additionalPorts:
      rest: 9020
    healthCheck:
      type: http
      port: 9020
      path: "/v1/projects/{projectId}/instances"

  bigquery:
    displayName: "BigQuery"
    port: 9050
    protocol: rest
    envVar: BIGQUERY_EMULATOR_HOST
    envValuePrefix: "http://"
    type: external
    defaultEnabled: true
    minTier: community
    gcloudApiName: bigquery
    terraformEnvVar: GOOGLE_BIGQUERY_CUSTOM_ENDPOINT
    additionalPorts:
      grpc: 9060
    healthCheck:
      type: http
      path: "/bigquery/v2/projects/{projectId}/datasets"

  secretmanager:
    displayName: "Secret Manager"
    port: gateway
    protocol: grpc
    envVar: SECRET_MANAGER_EMULATOR_HOST
    envValuePrefix: ""
    type: facade
    defaultEnabled: true
    minTier: community
    gcloudApiName: secretmanager
    terraformEnvVar: GOOGLE_SECRET_MANAGER_CUSTOM_ENDPOINT

  cloudtasks:
    displayName: "Cloud Tasks"
    port: gateway
    protocol: grpc
    envVar: CLOUD_TASKS_EMULATOR_HOST
    envValuePrefix: ""
    type: facade
    defaultEnabled: true
    minTier: community
    gcloudApiName: cloudtasks
    terraformEnvVar: GOOGLE_CLOUD_TASKS_CUSTOM_ENDPOINT

  cloudscheduler:
    displayName: "Cloud Scheduler"
    port: gateway
    protocol: grpc
    envVar: CLOUD_SCHEDULER_EMULATOR_HOST
    envValuePrefix: ""
    type: facade
    defaultEnabled: true
    minTier: community
    gcloudApiName: cloudscheduler
    terraformEnvVar: GOOGLE_CLOUD_SCHEDULER_CUSTOM_ENDPOINT

  cloudfunctions:
    displayName: "Cloud Functions (2nd Gen)"
    port: gateway
    protocol: grpc
    envVar: CLOUD_FUNCTIONS_EMULATOR_HOST
    envValuePrefix: ""
    type: facade
    defaultEnabled: true
    minTier: community
    gcloudApiName: cloudfunctions
    terraformEnvVar: GOOGLE_CLOUD_FUNCTIONS_CUSTOM_ENDPOINT

  alloydb:
    displayName: "AlloyDB"
    port: gateway
    protocol: grpc
    envVar: ALLOYDB_EMULATOR_HOST
    envValuePrefix: ""
    type: facade
    defaultEnabled: true
    minTier: community
    gcloudApiName: alloydb
    terraformEnvVar: GOOGLE_ALLOYDB_CUSTOM_ENDPOINT

  dataproc:
    displayName: "Dataproc"
    port: gateway
    protocol: grpc
    envVar: DATAPROC_EMULATOR_HOST
    envValuePrefix: ""
    type: facade
    defaultEnabled: true
    minTier: community
