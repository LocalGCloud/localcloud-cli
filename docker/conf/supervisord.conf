[inet_http_server]
port=127.0.0.1:9001

[supervisord]
nodaemon=true
logfile=/var/log/localcloud/supervisord.log
pidfile=/var/log/localcloud/supervisord.pid
childlogdir=/var/log/localcloud
loglevel=info
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/localcloud/pgdata
autostart=true
autorestart=true
priority=10
user=localcloud
stdout_logfile=/var/log/localcloud/postgresql-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/postgresql-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:pubsub-emulator]
command=bash -c 'exec /opt/java/bin/java -jar /opt/emulators/pubsub-lib/cloud-pubsub-emulator-*-all.jar --host=0.0.0.0 --port=8085'
autostart=%(ENV_LOCALCLOUD_ENABLE_PUBSUB)s
autorestart=true
priority=20
stdout_logfile=/var/log/localcloud/pubsub-emulator-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/pubsub-emulator-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:firestore-emulator]
command=/opt/java/bin/java -Duser.language=en -cp /opt/emulators/cloud-firestore-emulator.jar com.google.cloud.datastore.emulator.firestore.CloudFirestore --host=0.0.0.0 --port=8086
autostart=%(ENV_LOCALCLOUD_ENABLE_FIRESTORE)s
autorestart=true
priority=20
stdout_logfile=/var/log/localcloud/firestore-emulator-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/firestore-emulator-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:bigtable-emulator]
command=wait-for-pg.sh /usr/local/bin/localcloud-bigtable-emulator -host 0.0.0.0 -port 8087 -database-driver postgres -database-url "postgres://localcloud@localhost/localcloud?host=/var/run/postgresql&sslmode=disable" -strict-admin=true
autostart=%(ENV_LOCALCLOUD_ENABLE_BIGTABLE)s
autorestart=true
priority=25
user=localcloud
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/localcloud/bigtable-emulator-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/bigtable-emulator-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:spanner-emulator]
command=/usr/local/bin/spanner-gateway --hostname 0.0.0.0 --grpc_binary /usr/local/bin/spanner-emulator-wrapper --data_dir=/var/lib/localcloud/spanner-data
autostart=%(ENV_LOCALCLOUD_ENABLE_SPANNER)s
autorestart=true
priority=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
stdout_logfile=/var/log/localcloud/spanner-emulator-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/spanner-emulator-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:fake-gcs-server]
command=/usr/local/bin/fake-gcs-server -scheme http -port 4443 -public-host localhost:4443 -backend filesystem -filesystem-root /var/lib/localcloud/gcs-data
autostart=%(ENV_LOCALCLOUD_ENABLE_GCS)s
autorestart=true
priority=20
stdout_logfile=/var/log/localcloud/fake-gcs-server-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/fake-gcs-server-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:bigquery-emulator]
command=/opt/bqenv/bin/bigquery-emulator --project=%(ENV_LOCALCLOUD_PROJECT)s --port=9050 --grpc-port=9060 --log-level=info --log-format=json --database=/var/lib/localcloud/bigquery-data/bigquery.duckdb --memory-limit=1GB --threads=4 --temp-dir=/var/lib/localcloud/bigquery-data/tmp
autostart=%(ENV_LOCALCLOUD_ENABLE_BIGQUERY)s
autorestart=true
priority=20
stopsignal=TERM
stopwaitsecs=30
environment=PYTHONUNBUFFERED="1",GCS_DATA_DIR="/var/lib/localcloud/gcs-data"
stdout_logfile=/var/log/localcloud/bigquery-emulator-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/bigquery-emulator-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:valkey]
command=/usr/local/bin/valkey-server /etc/valkey.conf
autostart=%(ENV_LOCALCLOUD_ENABLE_MEMORYSTORE)s
autorestart=true
priority=15
stopsignal=TERM
stopwaitsecs=10
user=localcloud
stdout_logfile=/var/log/localcloud/valkey-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/valkey-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:localcloud-server]
command=wait-for-pg.sh /opt/java/bin/java %(ENV_JAVA_OPTS)s -jar /opt/localcloud/server.jar
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/localcloud/localcloud-server-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/localcloud/localcloud-server-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
autostart=%(ENV_LOCALCLOUD_ENABLE_LOCAL_PROXY)s
autorestart=true
priority=35
stderr_logfile=/var/log/localcloud/caddy.err.log
stdout_logfile=/var/log/localcloud/caddy.out.log

[program:dnsmasq]
command=/usr/sbin/dnsmasq --keep-in-foreground --conf-file=/etc/dnsmasq.conf
# DNS must start after network is ready but before any services that need it
priority=10
autostart=true
autorestart=true
stderr_logfile=/var/log/localcloud/dnsmasq.err.log
stdout_logfile=/var/log/localcloud/dnsmasq.out.log
