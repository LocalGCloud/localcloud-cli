# LocalCloud DNS — resolves all Google API hostnames to localhost.
# Queries for *.googleapis.com → 127.0.0.1 (handled by Caddy :443 → gateway :8080).
# All other queries are forwarded to the upstream DNS (unchanged).

# Resolve ALL *.googleapis.com to localhost (IPv4 only — Docker port mappings are IPv4-only)
address=/googleapis.com/127.0.0.1

# Also redirect GCE metadata server (Go library checks this first)
address=/metadata.google.internal/127.0.0.1

# Listen on all interfaces
listen-address=0.0.0.0
bind-interfaces

# Don't forward any queries — resolve only locally.
# macOS /etc/resolver sends only *.googleapis.com queries here,
# so there's no need for upstream forwarding.
port=53
no-resolv
no-poll

# Quiet logging
log-queries=extra
log-facility=/var/log/localcloud/dnsmasq.log
