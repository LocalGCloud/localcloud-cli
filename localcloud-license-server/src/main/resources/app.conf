# =============================================================================
# LocalCloud License Server — Environment Configuration Reference
# =============================================================================
# All configuration is via environment variables. This file documents every
# variable, its default, and where it is used in the code.
#
# Usage:
#   export ADMIN_PASSWORD="your-password"
#   export LICENSE_DB_URL="jdbc:postgresql://localhost:5432/localcloud"
#   java -jar localcloud-license-server-*.jar
#
# Or load this file:
#   set -a; source app.conf; set +a
# =============================================================================

# -- HTTP Server ------------------------------------------------------------------
# Port the license server listens on.
# Used by: LicenseServerConfig.java -> LicenseServerApplication.java
#LICENSE_PORT=9090


# -- PostgreSQL Database ----------------------------------------------------------
# JDBC URL for the license database. Must be a running PostgreSQL instance.
# The database must exist; tables are created automatically by SchemaInitializer.
# Used by: LicenseServerConfig.java -> LicenseDatabase.java -> HikariCP
#LICENSE_DB_URL=jdbc:postgresql://localhost:5432/localcloud

# Database credentials.
# Used by: LicenseServerConfig.java -> LicenseDatabase.java -> HikariCP
#LICENSE_DB_USER=license
#LICENSE_DB_PASSWORD=license


# -- SMTP / Email (for OTP delivery) ---------------------------------------------
# SMTP host for sending one-time password emails during authentication.
# Used by: LicenseServerConfig.java -> EmailService.java
#LICENSE_SMTP_HOST=localhost
#LICENSE_SMTP_PORT=587
#LICENSE_SMTP_USER=
#LICENSE_SMTP_PASSWORD=

# From-address for outgoing emails.
# Used by: LicenseServerConfig.java -> EmailService.java
#LICENSE_SMTP_FROM=noreply@local.cloud


# -- Authentication & Sessions ----------------------------------------------------
# Admin password for the /admin/api/* endpoints.
# REQUIRED - server will not start without this.
# Used by: LicenseServerConfig.java -> AdminHandler.java
#ADMIN_PASSWORD=your-strong-password-here

# OTP code expiry in minutes.
# Used by: LicenseServerConfig.java -> OtpService.java
#LICENSE_OTP_EXPIRY_MINUTES=15


# -- Trial Management -------------------------------------------------------------
# Default trial duration in days.
# Used by: LicenseServerConfig.java -> TrialRepository.java
#LICENSE_TRIAL_DAYS=14


# -- RSA Signing Key (Online License Tokens) ------------------------------------
# RS256 private key (base64-encoded DER PKCS8) for signing online license JWT tokens.
# If not set, an ephemeral keypair is generated on each startup — clients must
# fetch the public key from /license/public-key after every restart.
# Used by: KeyPairManager.java -> JwtSigner.java -> LicenseValidationHandler.java
# Generate with (add to app.conf or export as env var):
#   java -cp build/libs/localcloud-license-server-*-all.jar com.localcloud.license.keys.AdminCliKeyGen rsa
# Example output:
#   RSA_PRIVATE_KEY=MIIEvA...
#   PUBLIC_KEY=MIIBCg...
#LOCALCLOUD_LICENSE_ONLINE_PRIVATE_KEY=MIIEvA...


# -- Ed25519 Signing Key (Offline License Keys) -----------------------------------
# Ed25519 private key (base64-encoded PKCS8) for signing offline license keys (lc_of_).
# REQUIRED for offline key generation via the admin panel.
# If not set, offline key generation is DISABLED — admin panel will show an error.
#
# The matching public key is exposed at GET /license/offline-public-key for clients
# to set as LOCALCLOUD_LICENSE_PUBLIC_KEY.
#
# Key Rotation: Add a new key, regenerate invalid offline keys. Old keys remain
# valid as long as their public key is included in LOCALCLOUD_LICENSE_PUBLIC_KEY
# (comma-separated list on clients).
#
# Generate with:
#   java -cp build/libs/localcloud-license-server-*-all.jar \
#     com.localcloud.license.keys.AdminCliKeyGen keypair
#
# Example output:
#   OFFLINE_PRIVATE_KEY=MC4CAQAwBQYDK2VwBCIEIOrKzk2bqpllOc5E...
#   PUBLIC_KEY=MCowBQYDK2VwAyEAGK3_jB-1w10R6jSm1rJM2S...
#   KID=MCowBQYD
#
# Set on license server:
#   export LOCALCLOUD_LICENSE_OFFLINE_PRIVATE_KEY=<OFFLINE_PRIVATE_KEY>
#
# Set on clients (single key):
#   export LOCALCLOUD_LICENSE_PUBLIC_KEY=<PUBLIC_KEY>
#
# Also set this on the license server (for kid computation in offline keys):
#   export LOCALCLOUD_LICENSE_OFFLINE_PUBLIC_KEY=<PUBLIC_KEY>
#
# Set on clients (single key):
#   export LOCALCLOUD_LICENSE_PUBLIC_KEY=<PUBLIC_KEY>
#
# Set on clients (multi-key rotation):
#   export LOCALCLOUD_LICENSE_PUBLIC_KEY=<OLD_PUBLIC_KEY>,<NEW_PUBLIC_KEY>
#
# Used by: LicenseServerConfig.java -> LicenseServerApplication.java -> AdminHandler.java
#LOCALCLOUD_LICENSE_OFFLINE_PRIVATE_KEY=MC4CAQAwBQ...


# -- Admin UI Path (Advanced) ----------------------------------------------------
# Filesystem path to the admin UI static files directory.
# Default: "admin/dist" (auto-resolved: filesystem first, then classpath)
# Used by: LicenseServerApplication.java
#ADMIN_UI_PATH=admin/dist
